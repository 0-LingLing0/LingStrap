name: Build Lingstrap

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed for the Publish GitHub Release step to create a release + upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full tag history, needed to diff against the previous tag for the changelog

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # When this run was triggered by a version tag, bake that exact version into the exe instead
      # of whatever <Version> happens to be committed in the csproj - otherwise a freshly installed
      # v0.1.2 would still report itself as the older version the csproj was last bumped to, and the
      # update checker would immediately (and wrongly) claim an update is available.
      - name: Publish Lingstrap
        shell: pwsh
        run: |
          $version = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".TrimStart('v') } else { $null }
          if ($version) {
            dotnet publish Lingstrap.csproj -c Release -o publish -p:Version=$version -p:AssemblyVersion=$version -p:FileVersion=$version
          } else {
            dotnet publish Lingstrap.csproj -c Release -o publish
          }

      - name: Publish LingstrapSetup
        run: dotnet publish Setup/Setup.csproj -c Release -o publish-setup

      - name: Upload Lingstrap.exe
        uses: actions/upload-artifact@v4
        with:
          name: Lingstrap
          path: publish/Lingstrap.exe
          if-no-files-found: error

      - name: Upload LingstrapSetup.exe
        uses: actions/upload-artifact@v4
        with:
          name: LingstrapSetup
          path: publish-setup/LingstrapSetup.exe
          if-no-files-found: error

      # Real "what was fixed" notes for the in-app update dialog: a plain bullet list of commit
      # subjects since the previous tag. GitHub's own generate_release_notes falls back to a bare
      # compare-link with nothing else, since this repo commits straight to master instead of PRs.
      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tags = git tag --sort=-creatordate
          $current = "${{ github.ref_name }}"
          $currentIndex = [array]::IndexOf($tags, $current)
          if ($currentIndex -ge 0 -and $currentIndex -lt $tags.Length - 1) {
            $range = "$($tags[$currentIndex + 1])..$current"
          } else {
            $range = $current
          }
          $log = git log $range --pretty=format:"- %s" --no-merges
          if ([string]::IsNullOrWhiteSpace($log)) { $log = "No notable changes." }
          $log | Out-File -FilePath changelog.txt -Encoding utf8

      # The public, human-facing release for this version tag - only LingstrapSetup.exe attached, so
      # someone landing here by hand only ever sees the one small file they're meant to download.
      # Uses the workflow's own built-in GITHUB_TOKEN, so no personal access token ever needs to be
      # created or stored for this.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish-setup/LingstrapSetup.exe
          body_path: changelog.txt

      # Lingstrap.exe itself is NOT attached to the release above - it lives here instead, under a
      # fixed tag that gets overwritten every version. LingstrapSetup.exe (InstallerService) fetches
      # it from this exact release by tag name. Kept as a pre-release so it never becomes the repo's
      # "Latest release" and stays out of the way of anyone just browsing Releases.
      #
      # PERMANENT CONTRACT: tag_name "lingstrap-binary" and the file name "Lingstrap.exe" must never
      # change. Every LingstrapSetup.exe already handed out looks for exactly these two names on
      # every future run (see Setup/InstallerService.cs) - renaming either one silently breaks every
      # copy already out in the world.
      - name: Publish Lingstrap.exe binary release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lingstrap-binary
          name: "Lingstrap.exe (internal - not for direct download)"
          prerelease: true
          body: "Used internally by LingstrapSetup.exe and the in-app updater. Get the installer from the latest normal release instead."
          files: publish/Lingstrap.exe
